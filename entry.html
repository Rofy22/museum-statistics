<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Rahaf Albunni">
<title>إدخال بيانات يدوي | إحصائيات المتحف</title>
<link rel="preload" as="font" type="font/woff2" href="fonts/cairo-arabic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/cairo-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/elmessiri-arabic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/sourceserif4-latin.woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loading-overlay" id="loadingOverlay" hidden><img src="img/logo-mark.png" alt="" class="loading-logo"></div>

<header>
  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none;">
      <span class="logo-icon"><img src="img/logo-mark.png" alt=""></span>
      <span data-i18n="brand">إحصائيات المتحف</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="navHome">الرئيسية</a></li>
      <li><a href="dashboard.html" data-i18n="navDashboard">لوحة المعلومات</a></li>
      <li><a href="entry.html" class="active" data-i18n="navEntry">الإدخال اليدوي</a></li>
      <li><a href="simulation.html" data-i18n="navSimulation">محاكاة QR</a></li>
    </ul>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </nav>
</header>

<section class="page-hero">
  <h1 data-i18n="entryPageTitle">إدخال بيانات يدوي</h1>
  <p data-i18n="entryPageSubtitle">لإدخال عدد الزوار في كل متحف وعدد التذاكر المباعة يدوياً من قِبل الموظف. تُحفظ السجلات تلقائياً وتظهر بالجدول أدناه.</p>
</section>

<div class="container report-section">

  <form class="entry-card" id="entryForm">
    <div class="form-grid">
      <div class="form-field">
        <label data-i18n="entryDateLabel">التاريخ</label>
        <div class="readonly-value" id="entryDateDisplay">—</div>
      </div>

      <div class="form-field">
        <label data-i18n="entryTimeLabel">الوقت</label>
        <div class="readonly-value" id="entryTimeDisplay">—</div>
      </div>

      <div class="contents" id="museumInputs"></div>

      <label class="museum-check">
        <input type="checkbox" id="entryInquiry">
        <span class="museum-check-circle" style="--check-color:#6e7c80"></span>
        <span class="museum-check-label" data-i18n="entryInquiryLabel">استفسار</span>
      </label>

      <div class="form-field">
        <label for="entryAdultTickets" data-i18n="entryAdultTicketsLabel">تذاكر بالغين</label>
        <input type="number" min="0" step="1" id="entryAdultTickets" placeholder="0">
      </div>
    </div>

    <button type="submit" class="btn-solid" data-i18n="entrySubmitBtn">حفظ السجل</button>
    <p class="entry-status" id="entryStatus" hidden></p>
  </form>

  <h2 class="section-heading" data-i18n="entriesTableTitle">السجلات المُدخلة</h2>

  <div class="table-wrap">
    <table>
      <thead id="entriesTableHead"></thead>
      <tbody id="entriesTableBody"></tbody>
    </table>
  </div>

</div>

<footer>
  <p data-i18n="footer">© 2026 نظام إحصائيات المتحف — نموذج تجريبي ببيانات وهمية.</p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/mockData.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/entry.js"></script>
<script src="js/loading.js"></script>
</body>
</html>
